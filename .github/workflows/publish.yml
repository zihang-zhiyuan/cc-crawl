# publish.yml — 推送 v* 标签时构建并发布到 PyPI
# 需要在仓库 Settings → Secrets 配置 PYPI_TOKEN（与 asyrq 相同的 PyPI API Token）

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Check PyPI token
        env:
          RAW_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::PYPI_TOKEN secret is not set in this repository"
            exit 1
          fi
          echo "token length: ${#TOKEN}"
          case "$TOKEN" in
            pypi-*) echo "token prefix ok" ;;
            *)
              echo "::error::PYPI_TOKEN does not look like a PyPI API token (must start with pypi-)"
              exit 1
              ;;
          esac

      - name: Publish to PyPI
        env:
          RAW_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          UV_PUBLISH_TOKEN="$TOKEN" uv publish --verbose
